
volumes:
  postgres_data:
  alarm-service-data:
  license-data:
    external: true

networks:
  edgex-network:
    driver: "bridge"

services:

  central-ui:
    image: iotechsys/dev-central-ui:4.0.18.dev

  alarm-service:
    image: iotechsys/alarm-service:latest
    ports:
      - 4840:4840
    volumes:
     - ${PWD}/deployment/:/deployment
    environment:
      - ALARM_CONFIGS_DIR=/deployment/alarms
      - MESSAGEBUS_SOURCES_DIR=/deployment/sources
      - WRITABLE_LOGLEVEL=INFO
      - MESSAGEBUS_SUB_TOPICS=["xrt/mqtt/input"]
      - ALARM_ENABLE_DEFAULT_INSECURE_AES_KEY=true
      #- DISABLE_API=1
      #- DISABLE_ALARM_SERVER=1
      - ALARM_STATIC_ROUTING_ENABLED=true
      - ALARM_STATIC_ROUTING_CONDITIONS_PATH=/deployment/routing/conditions.json
      - ALARM_STATIC_ROUTING_ACTIONS_PATH=/deployment/routing/actions.json
      - ALARM_STATIC_ROUTING_ROUTES_PATH=/deployment/routing/routes.json

  smtp_server:
    container_name: smtp_server
    image: gessnerfl/fake-smtp-server
    restart: unless-stopped
    ports:
      - 8025:8025 # smtp
      - 8080:8080 # webui

  controller-0:
    image: iotechsys/pymodbus-sim:1.0.4
    container_name: controller-0
    command: --profile profiles/Controller.json --script /sim/script.py --port 5020
    networks:
      - edgex-network
    ports:
      - "5020:5020"
    volumes:
      - ${PWD}/sim:/sim
      - ${PWD}/res/profiles:/profiles
    restart: always

  controller-1:
    image: iotechsys/pymodbus-sim:1.0.4
    container_name: controller-1
    command: --profile profiles/Controller.json --script /sim/script.py --port 5021
    networks:
      - edgex-network
    ports:
      - "5021:5021"
    volumes:
      - ${PWD}/sim:/sim
      - ${PWD}/res/profiles:/profiles
    restart: always

  controller-2:
    image: iotechsys/pymodbus-sim:1.0.4
    container_name: controller-2
    command: --profile profiles/Controller.json --script /sim/script.py --port 5022
    networks:
      - edgex-network
    ports:
      - "5022:5022"
    volumes:
      - ${PWD}/sim:/sim
      - ${PWD}/res/profiles:/profiles
    restart: always
